<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 지역 문제 조사 · 분류판</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --sub:#5a6478; --line:#dfe4ee; --accent:#2f6fed;
    --c1:#e8734a; --c2:#d94a5a; --c3:#3aa66a; --c4:#8a63d2; --c5:#c9a227; --c6:#2b8fc7; --c7:#b5724a; --c8:#7a8597;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
  header{background:#1c2333;color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:26px}
  header .sub{color:#b8c2d6;font-size:15px}
  main{max-width:1200px;margin:0 auto;padding:22px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h2{margin:0 0 12px;font-size:21px}
  label{display:block;font-size:15px;color:var(--sub);margin:10px 0 4px}
  input[type=text],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1}
  button{font:inherit;font-weight:700;padding:11px 18px;border-radius:10px;border:0;cursor:pointer;background:var(--accent);color:#fff}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:#fff;color:#c0392b;border:1px solid #f1c3bd}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .suggest{margin-top:12px;padding:12px 14px;border-radius:10px;background:#eef3ff;border:1px solid #cbd9ff;font-size:16px;display:none}
  .suggest b{color:var(--accent)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:16px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f8f9fc;font-size:14px;color:var(--sub)}
  td select{padding:5px 8px;font-size:15px;width:auto}
  td .del{background:none;border:0;color:#c0392b;font-size:18px;padding:2px 6px;cursor:pointer}
  .bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:16px}
  .bar .track{height:28px;background:#eef1f6;border-radius:8px;overflow:hidden}
  .bar .fill{height:100%;border-radius:8px;transition:width .4s}
  .bar .n{text-align:right;font-weight:700}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .stat{flex:1;min-width:120px;background:#f8f9fc;border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:30px;font-weight:800;color:var(--accent)}
  .stat .k{font-size:14px;color:var(--sub)}
  .empty{color:var(--sub);text-align:center;padding:30px 0}
  .hint{font-size:14px;color:var(--sub);margin-top:8px}
  .pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .legend{font-size:15px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .legend span{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .big{font-size:22px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🏘️ 우리 지역 문제 조사 · 분류판</h1>
    <div class="sub">4학년 사회 · 학생이 조사한 지역 문제를 입력하면 자동으로 종류를 나누고 표와 그래프로 보여줍니다.</div>
  </div>
  <div class="btns" style="margin:0">
    <button class="ghost" onclick="toggleBig()">🔍 글자 크게/작게</button>
  </div>
</header>

<main>
<div class="grid">
  <!-- 입력 -->
  <section class="card">
    <h2>1. 조사한 문제 입력하기</h2>
    <div class="row">
      <div style="flex:0 0 160px"><label>이름(모둠)</label><input type="text" id="name" placeholder="예: 김민준 / 2모둠"></div>
      <div><label>어디에서 생긴 문제인가요?</label><input type="text" id="place" placeholder="예: 학교 앞 사거리, ○○공원"></div>
    </div>
    <label>조사한 문제를 자세히 써 주세요</label>
    <textarea id="text" placeholder="예: 학교 앞 도로에 차가 많아서 등교할 때 길을 건너기 어려워요." oninput="preview()"></textarea>
    <div class="suggest" id="suggest"></div>
    <select id="cat" style="display:none"></select>
    <div class="btns">
      <button onclick="addItem()">➕ 추가하기 (종류는 자동으로 정해져요)</button>
      <button class="ghost" onclick="clearForm()">지우기</button>
    </div>
    <div class="hint">※ 문제 종류는 입력한 문장을 보고 자동으로 분류됩니다. 잘못 분류된 경우에만 선생님이 아래 표에서 바꿔 주세요.</div>
  </section>

  <!-- 그래프 -->
  <section class="card">
    <h2>2. 종류별 결과 그래프</h2>
    <div class="stats">
      <div class="stat"><div class="v" id="total">0</div><div class="k">조사한 문제 수</div></div>
      <div class="stat"><div class="v" id="topcat">-</div><div class="k">가장 많은 종류</div></div>
      <div class="stat"><div class="v" id="ncats">0</div><div class="k">나온 종류 수</div></div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="pie" id="pie"></div>
  </section>
</div>

<!-- 표 -->
<section class="card" style="margin-top:20px">
  <h2>3. 조사 결과 표</h2>
  <div class="row" style="align-items:center">
    <div style="flex:0 0 260px"><label>종류별로 보기</label><select id="filter" onchange="render()"><option value="">전체</option></select></div>
    <div class="btns" style="margin:0;justify-content:flex-end">
      <button class="ghost" onclick="downloadCSV()">⬇️ 엑셀(CSV)로 저장</button>
      <button class="ghost" onclick="window.print()">🖨️ 인쇄</button>
      <button class="danger" onclick="resetAll()">전체 삭제</button>
    </div>
  </div>
  <div style="overflow-x:auto;margin-top:12px">
    <table>
      <thead><tr><th>#</th><th>이름(모둠)</th><th>장소</th><th>조사한 문제</th><th>종류</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="hint">※ 입력한 내용은 이 컴퓨터(브라우저)에 자동 저장되어 창을 닫았다 열어도 남아 있습니다.</div>
</section>
</main>

<script>
const CATS = [
  {id:1,name:'교통 혼잡 문제',color:'var(--c1)',kw:['교통','차가 많','차량','막혀','막힘','막히','정체','혼잡','신호','건너기','건너','횡단보도','도로','길이 좁','버스가 안','버스 노선','버스','출퇴근','과속','차들이','자동차','오토바이','킥보드','자전거','등굣길','하굣길','통학']},
  {id:2,name:'안전 문제',color:'var(--c2)',kw:['안전','위험','사고','다칠','다쳤','가로등','어두','어둡','범죄','CCTV','씨씨티비','깨진','무너','부서진','학교폭력','유괴','낯선 사람','미끄러','불','화재','공사장','개가','들개','유기견']},
  {id:3,name:'환경 오염 문제',color:'var(--c3)',kw:['오염','미세먼지','매연','공기','냄새','악취','하천','강물','물이 더럽','수질','소음','시끄러','공장','폐수','연기','녹조','먼지']},
  {id:4,name:'주차 문제',color:'var(--c4)',kw:['주차','불법 주정차','주정차','세워','세워둔','세워져','차를 댈','주차장','주차 공간','인도에 차','골목에 차']},
  {id:5,name:'쓰레기 문제',color:'var(--c5)',kw:['쓰레기','버려','버린','무단 투기','투기','담배꽁초','꽁초','분리수거','재활용','음식물','봉투','종량제','휴지','캔','페트병','비닐']},
  {id:6,name:'시설 부족 문제',color:'var(--c6)',kw:['부족','없어','없다','없음','없습니다','없으','모자','놀이터','공원이','도서관','체육관','수영장','운동장','화장실','벤치','의자','그늘','쉼터','병원','약국','마트','편의','부족해','적어','적다','고장','망가','낡','오래되','수리','멀어','멀다','경사로','엘리베이터']},
  {id:7,name:'문화 유산 훼손 문제',color:'var(--c7)',kw:['문화재','문화 유산','문화유산','유적','유물','낙서','훼손','고분','성곽','비석','절','사찰','향교','서원','고택','한옥','전통','옛날 건물','역사','박물관']},
  {id:8,name:'기타',color:'var(--c8)',kw:[]},
];
const KEY='region_problems_v1';
let items = JSON.parse(localStorage.getItem(KEY)||'[]');

function classify(t){
  const s=(t||'').replace(/\s+/g,' ');
  const scores=CATS.map(c=>({c,score:c.kw.reduce((a,k)=>a+(s.includes(k)?(k.length>=3?2:1):0),0)}));
  // 주차 > 교통 우선 (주차 키워드가 있으면 주차)
  const best=scores.filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.c.id-b.c.id)[0];
  if(!best) return 8;
  if(s.includes('주차')||s.includes('주정차')) return 4;
  if(s.includes('쓰레기')) return 5;
  return best.c.id;
}
const catOf=id=>CATS.find(c=>c.id===id);

function preview(){
  const t=document.getElementById('text').value.trim();
  const box=document.getElementById('suggest');
  if(!t){box.style.display='none';return;}
  const id=classify(t);
  document.getElementById('cat').value=id;
  box.style.display='block';
  box.innerHTML='🤖 자동 분류: <b>'+id+'. '+catOf(id).name+'</b>'+(id===8?' (아직 어울리는 종류를 찾지 못했어요. 조금 더 자세히 써 보세요.)':'');
}
function addItem(){
  const text=document.getElementById('text').value.trim();
  if(!text){alert('조사한 문제를 써 주세요.');return;}
  const cat=classify(text);
  items.push({name:document.getElementById('name').value.trim(),place:document.getElementById('place').value.trim(),text,cat,t:Date.now()});
  save();clearForm();render();
  const box=document.getElementById('suggest');
  box.style.display='block';
  box.innerHTML='✅ 추가되었어요! 이 문제는 <b>'+cat+'. '+catOf(cat).name+'</b>로 분류했습니다.';
  setTimeout(()=>{if(!document.getElementById('text').value.trim())box.style.display='none';},4000);
}
function clearForm(){['place','text'].forEach(i=>document.getElementById(i).value='');document.getElementById('suggest').style.display='none';document.getElementById('cat').value=8;document.getElementById('text').focus();}
function save(){localStorage.setItem(KEY,JSON.stringify(items));}
function del(i){if(confirm('이 항목을 삭제할까요?')){items.splice(i,1);save();render();}}
function changeCat(i,v){items[i].cat=+v;save();render();}
function resetAll(){if(confirm('모든 조사 결과를 삭제할까요? 되돌릴 수 없습니다.')){items=[];save();render();}}
function toggleBig(){document.body.classList.toggle('big');}

function render(){
  const f=document.getElementById('filter').value;
  const tb=document.getElementById('tbody');
  const list=items.map((it,i)=>({it,i})).filter(x=>!f||x.it.cat===+f);
  tb.innerHTML=list.length?list.map(({it,i})=>`<tr>
    <td>${i+1}</td><td>${esc(it.name)}</td><td>${esc(it.place)}</td><td>${esc(it.text)}</td>
    <td><span class="badge" style="background:${catOf(it.cat).color}">${catOf(it.cat).name}</span><br>
      <select onchange="changeCat(${i},this.value)">${CATS.map(c=>`<option value="${c.id}" ${c.id===it.cat?'selected':''}>${c.id}. ${c.name}</option>`).join('')}</select></td>
    <td><button class="del" title="삭제" onclick="del(${i})">✕</button></td></tr>`).join('')
    :'<tr><td colspan="6" class="empty">아직 입력한 문제가 없어요. 왼쪽에서 추가해 보세요!</td></tr>';

  const counts=CATS.map(c=>items.filter(it=>it.cat===c.id).length);
  const max=Math.max(1,...counts), total=items.length;
  document.getElementById('total').textContent=total;
  document.getElementById('ncats').textContent=counts.filter(n=>n>0).length;
  const top=Math.max(...counts);
  document.getElementById('topcat').textContent=total?CATS.filter((c,i)=>counts[i]===top).map(c=>c.name.replace(' 문제','')).join(', '):'-';
  document.getElementById('bars').innerHTML=CATS.map((c,i)=>`<div class="bar"><div>${c.id}. ${c.name}</div><div class="track"><div class="fill" style="width:${counts[i]/max*100}%;background:${c.color}"></div></div><div class="n">${counts[i]}</div></div>`).join('');

  // 원그래프(SVG)
  let acc=0;const r=70,cx=80,cy=80;
  const paths=CATS.map((c,i)=>{if(!counts[i])return '';const a0=acc/total*2*Math.PI,a1=(acc+counts[i])/total*2*Math.PI;acc+=counts[i];
    if(counts[i]===total)return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c.color}"/>`;
    const x0=cx+r*Math.sin(a0),y0=cy-r*Math.cos(a0),x1=cx+r*Math.sin(a1),y1=cy-r*Math.cos(a1),big=a1-a0>Math.PI?1:0;
    return `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${big} 1 ${x1},${y1} Z" fill="${c.color}" stroke="#fff" stroke-width="2"/>`;}).join('');
  document.getElementById('pie').innerHTML=total?`<svg width="160" height="160" viewBox="0 0 160 160">${paths}</svg>
    <div class="legend">${CATS.map((c,i)=>counts[i]?`<div><span style="background:${c.color}"></span>${c.name} ${counts[i]}개 (${Math.round(counts[i]/total*100)}%)</div>`:'').join('')}</div>`:'';
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function downloadCSV(){
  const rows=[['번호','이름(모둠)','장소','조사한 문제','종류'],...items.map((it,i)=>[i+1,it.name,it.place,it.text,catOf(it.cat).name])];
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='우리지역문제_조사결과.csv';a.click();
}
// 초기화
const sel=document.getElementById('cat'),fil=document.getElementById('filter');
CATS.forEach(c=>{sel.insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.id}. ${c.name}</option>`);fil.insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.id}. ${c.name}</option>`);});
sel.value=8;render();
</script>
</body>
</html>
